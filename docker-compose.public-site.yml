# Serve the public landing page on its own domain, separate from the dashboard.
#   docker compose -f docker-compose.yml -f docker-compose.public-site.yml up -d --build
# Needs PUBLIC_DOMAIN in .env (e.g. optizen.dev) next to DOMAIN (the dashboard, e.g. ops-x7k.optizen.dev).
services:
  web:
    environment:
      PUBLIC_SITE_HOST: ${PUBLIC_DOMAIN:?Set PUBLIC_DOMAIN in .env}

  caddy:
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:?Set PUBLIC_DOMAIN in .env}
    volumes:
      - ./Caddyfile.public-site:/etc/caddy/Caddyfile:ro
