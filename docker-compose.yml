services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # Baked into the Next.js build: /api/* is proxied here (internal Docker network).
        NEXT_PUBLIC_API_URL: http://server:3001
    environment:
      API_URL: http://server:3001
    depends_on:
      - server
    restart: unless-stopped

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    environment:
      PORT: 3001
      WEB_URL: https://${DOMAIN}
      DB_PATH: /app/data/launchpad.db.json
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in .env}
      NODE_ENV: production
    volumes:
      - ./data:/app/data
      # SSH private keys for the servers Launchpad manages. In the UI, use paths like /app/ssh/id_ed25519
      - ${SSH_KEYS_DIR:-./ssh}:/app/ssh:ro
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    depends_on:
      - web
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
